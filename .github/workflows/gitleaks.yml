# Secret scan on every PR and push to main: gitleaks over the FULL git history with .gitleaks.toml.
# Uses the pinned gitleaks release binary (checksum-verified) instead of gitleaks-action, which needs a paid
# license key for organization repos. No secrets required.
name: gitleaks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tgz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tgz\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tgz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (full history)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 -v .
      - name: repo secret patterns (scripts/check-no-secrets.sh)
        run: SKIP_GITLEAKS=1 scripts/check-no-secrets.sh
