# tfh-local egress proxy. Default deny: only hosts matching a line in allowlist.txt are reachable.
User nobody
Group nobody
Port 8888
Listen 0.0.0.0
Timeout 120
LogLevel Connect
MaxClients 100
# Only containers on the docker networks may use it.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
# HTTPS via CONNECT on 443 only.
ConnectPort 443
# Allow-list (POSIX extended regex, one per line), matched on the host name. Built at start from
# allowlist.txt (non-prod Sticky/TF; empty offline) + readonly-allowlist.txt (Builder read-only), see Dockerfile.
Filter "/tmp/filter.txt"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes
ViaProxyName "tfh-local-proxy"
DisableViaHeader Yes
