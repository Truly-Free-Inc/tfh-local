# tfh-local: local TFH stack. See README.md (SAFETY section first).
#
# Run via `make up` (runs scripts/preflight.sh first). Do not run `docker compose up` directly.
# Validate:  docker compose config -q   (works before apps/ exist and with .env from .env.example)
#
# Networks:
#   internal : app containers. `internal: true` = NO direct internet. Outbound only via `proxy` (allow-list).
#   egress   : only `proxy` sits here; it can reach the internet, but tinyproxy default-denies every host
#              that is not in proxy/allowlist.txt (non-prod Sticky + TF only).
#   edge     : only `ingress` sits here; it publishes host ports (Docker cannot publish ports of containers
#              that are only on an internal network) and forwards TCP to services on `internal`.
# Image builds use the Docker daemon's network, not these runtime networks, so registries (Go modules,
# Docker Hub, apk/apt) work at build time while running containers stay locked down.
#
# Profiles: default = core (wired). `stub` = not yet wired (TODO). `vector` = vector search. `cron` = refuses.

name: ${COMPOSE_PROJECT_NAME:-tfh-local}

x-proxy-env: &proxy-env
  HTTP_PROXY: http://proxy:8888
  HTTPS_PROXY: http://proxy:8888
  http_proxy: http://proxy:8888
  https_proxy: http://proxy:8888
  NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,mailpit,klaviyo-recorder,tf-api,tf-apigateway,kratos,keto,memberportal,admin-panel,aff-landing-pages,vector-search
  no_proxy: localhost,127.0.0.1,postgres,redis,minio,mailpit,klaviyo-recorder,tf-api,tf-apigateway,kratos,keto,memberportal,admin-panel,aff-landing-pages,vector-search

x-stub: &stub
  image: alpine:3.20
  profiles: ["stub"]
  restart: "no"
  networks: [internal]
  command: ["sh", "-c", "echo 'STUB: not wired yet (see docker-compose.yml TODO). Refusing to run.' >&2; exit 1"]

networks:
  internal:
    internal: true
  egress: {}
  edge: {}

volumes:
  postgres-data: {}
  redis-data: {}
  minio-data: {}
  klaviyo-data: {}
  gateway-postgres-data: {}

services:
  # ---------------------------------------------------------------- core (wired)
  postgres:
    image: postgres:17.4
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/init-wrapper.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tfh_local_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfh_local_admin_pw}
      APP_DB_USER: ${APP_DB_USER:-tf_api_local}
      APP_DB_PASS: ${APP_DB_PASS:-tf_api_local_pw}
      APP_DB_NAME: ${APP_DB_NAME:-tf_api_local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mirrors apps/tf-api/docker-compose.yml (same init-wrapper + db-bootstrap).
      - ./apps/tf-api/dockercompose_init/init-wrapper.sh:/init-wrapper.sh:ro
      - ./apps/tf-api/db-bootstrap/sql/01_app_init.sql:/docker-entrypoint-initdb.d/03_app_init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-tfh_local_admin}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  flyway:
    build:
      context: ./apps/tf-api
      dockerfile: .cicd/docker/Dockerfile.flyway   # tf-api's own Flyway image (flyway/sql + undo)
    restart: "no"
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME:-tf_api_local}
      DB_USER: ${APP_DB_USER:-tf_api_local}
      DB_PASSWORD: ${APP_DB_PASS:-tf_api_local_pw}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  # Feature flags + test-only data. Runs ONCE per fresh DB (marker table), never updates flags afterwards.
  seed:
    image: postgres:17.4
    restart: "no"
    entrypoint: ["/bin/bash", "/seed/run-seed.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${APP_DB_USER:-tf_api_local}
      PGPASSWORD: ${APP_DB_PASS:-tf_api_local_pw}
      PGDATABASE: ${APP_DB_NAME:-tf_api_local}
    volumes: ["./seed:/seed:ro"]
    depends_on:
      flyway: { condition: service_completed_successfully }
    networks: [internal]

  tf-api:
    build:
      context: ./apps/tf-api
      dockerfile: ../../docker/tf-api.Dockerfile   # multi-stage: Go build from src/ -> debian-slim
    image: tfh-local/tf-api:local
    restart: unless-stopped
    environment:
      <<: *proxy-env
      PORT: "3000"
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: postgres
      DB_HOST_RO: postgres
      DB_PORT: "5432"
      DB_USER: ${APP_DB_USER:-tf_api_local}
      DB_PASSWORD: ${APP_DB_PASS:-tf_api_local_pw}
      DB_NAME: ${APP_DB_NAME:-tf_api_local}
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_HOST_RO: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_TLS_ENABLED: "false"   # tf-api defaults to TLS (ElastiCache); local redis is plain
      # Portal sessions: write to the local (nextgen) Redis above. REDIS_HOST_TFH_CORE is never set (tfhcore OUT).
      SESSION_WRITE_NEXTGEN_REDIS_ENABLED: "true"
      PORTAL_COOKIE_DOMAIN: ""
      TF_INTERNAL_APIGATEWAY_DOMAIN: http://tf-apigateway:8080
      # OTEL default is the k8s collector; send to loopback instead (connection refused, nothing leaves).
      OTEL_EXPORTER_OTLP_ENDPOINT: 127.0.0.1:4318
      # Real NON-PROD Sticky / TF, test orders only. Preflight enforces the host allow-list.
      STICKY_DOMAIN: ${STICKY_DOMAIN:-}
      STICKY_API_EXT: ${STICKY_API_EXT:-}
      STICKY_API_EXT_2: ${STICKY_API_EXT_2:-}
      STICKY_APP_KEY: ${STICKY_APP_KEY:-}
      STICKY_USERNAME: ${STICKY_USERNAME:-}
      STICKY_PASSWORD: ${STICKY_PASSWORD:-}
      STICKY_WEBHOOK_USERNAME: ${STICKY_WEBHOOK_USERNAME:-}
      STICKY_WEBHOOK_PASSWORD: ${STICKY_WEBHOOK_PASSWORD:-}
      TF_COMPOSITION_API_BASE_URL: ${TF_COMPOSITION_API_BASE_URL:-}
      TF_COMPOSITION_API_TOKEN: ${TF_COMPOSITION_API_TOKEN:-}
      TF_SELLING_PLAN_ID: ${TF_SELLING_PLAN_ID:-}
      # S3 -> MinIO. AWS SDK v2 honours AWS_ENDPOINT_URL; it uses virtual-host style (<bucket>.minio:9000), which
      # MinIO serves via MINIO_DOMAIN=minio + a network alias per bucket (see the minio service). No tf-api change.
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_KEY: ${MINIO_ROOT_USER:-tfh-local-minio}
      AWS_SECRET: ${MINIO_ROOT_PASSWORD:-tfh-local-minio-pw}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_CDN_DOMAIN: ${AWS_CDN_DOMAIN:-}
      AWS_IMAGE_PATH: ${AWS_IMAGE_PATH:-}
      AWS_PRESIGNED_URL_EXPIRY_MINUTES: ${AWS_PRESIGNED_URL_EXPIRY_MINUTES:-15}
      CATALOG_S3_BUCKET: ${CATALOG_S3_BUCKET:-}
      CATALOG_S3_KEY: ${CATALOG_S3_KEY:-}
      SEARCH_MODEL_S3_BUCKET: ${SEARCH_MODEL_S3_BUCKET:-}
      SEARCH_MODEL_S3_KEY: ${SEARCH_MODEL_S3_KEY:-}
      SEARCH_MODEL_S3_TMP_KEY: ${SEARCH_MODEL_S3_TMP_KEY:-}
      SITEMAP_S3_BUCKET: ${SITEMAP_S3_BUCKET:-}
      SITEMAP_S3_KEY: ${SITEMAP_S3_KEY:-}
      YOTPO_S3_BUCKET: ${YOTPO_S3_BUCKET:-}
      YOTPO_S3_KEY: ${YOTPO_S3_KEY:-}
      # Klaviyo -> local recorder. KLAVIYO_API_BASE_URL needs tf-api branch tfh-local/klaviyo-base-url (PR to develop);
      # on a tf-api without it, Klaviyo calls go to the proxy and are DENIED. The key/list values are local
      # placeholders (not real keys) so tf-api does not skip Klaviyo; they only ever reach the recorder.
      KLAVIYO_API_BASE_URL: http://klaviyo-recorder:8090/api
      KLAVIYO_PUBLIC_KEY: ${KLAVIYO_PUBLIC_KEY:-tfh-local-recorder-only}
      KLAVIYO_PRIVATE_KEY: ${KLAVIYO_PRIVATE_KEY:-tfh-local-recorder-only}
      KLAVIYO_LIST_ID: ${KLAVIYO_LIST_ID:-tfhlocal}
      KLAVIYO_LIST_ID_2: ${KLAVIYO_LIST_ID_2:-}
      KLAVIYO_LIST_ID_3: ${KLAVIYO_LIST_ID_3:-}
      KLAVIYO_LIST_ID_4: ${KLAVIYO_LIST_ID_4:-}
      BUILDER_API_KEY: ${BUILDER_API_KEY:-}
      BUILDER_API_URL: ${BUILDER_API_URL:-}
      # Disabled locally (explicitly empty).
      SENTRY_DSN: ""
      CLOUDWATCH_LOG_GROUP: ""
      CLOUDWATCH_LOG_STREAM: ""
      FACEBOOK_ACCESS_TOKEN: ""
      FACEBOOK_PIXEL_ID: ""
      CUSTOMERLABS_WEBHOOK_URL: ""
      # NEVER set: SYTE_LINE_* (Syteline/Infor), TFH_CORE_* / TFHCORE_* (tfhcore OUT), AVALARA_* (OUT).
    depends_on:
      seed: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      proxy: { condition: service_started }
    networks: [internal]

  # Egress allow-list proxy: default deny. Only hosts in proxy/allowlist.txt (non-prod Sticky + TF).
  proxy:
    build: ./proxy
    restart: unless-stopped
    volumes:
      - ./proxy/allowlist.txt:/etc/tinyproxy/allowlist.txt:ro
      - ./proxy/readonly-allowlist.txt:/etc/tinyproxy/readonly-allowlist.txt:ro
    networks: [internal, egress]

  # Host port publishing for services on the internal network (TCP passthrough, nginx stream).
  ingress:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./ingress/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:15432"
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:16379"
      - "127.0.0.1:${TF_API_HOST_PORT:-13000}:13000"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-18025}:18025"
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-11025}:11025"
      - "127.0.0.1:${MINIO_API_HOST_PORT:-19000}:19000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:19001"
      - "127.0.0.1:${KLAVIYO_RECORDER_HOST_PORT:-18090}:18090"
      - "127.0.0.1:${MEMBERPORTAL_HOST_PORT:-13001}:13001"
      - "127.0.0.1:${ADMIN_PANEL_HOST_PORT:-13002}:13002"
      - "127.0.0.1:${FUNNELS_HOST_PORT:-13003}:13003"
      - "127.0.0.1:${VECTOR_SEARCH_HOST_PORT:-18077}:18077"
      - "127.0.0.1:${APIGATEWAY_HOST_PORT:-13004}:13004"
      - "127.0.0.1:${KRATOS_PUBLIC_HOST_PORT:-14433}:14433"
      - "127.0.0.1:${KRATOS_ADMIN_HOST_PORT:-14434}:14434"
    networks: [internal, edge]

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    networks: [internal]

  # MinIO stopped publishing images to Docker Hub/quay (2025). pgsty/minio is the community fork that keeps
  # the web console and ships `mc`; pinned by release tag. Used for both minio and minio-init.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tfh-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tfh-local-minio-pw}
      MINIO_DOMAIN: minio   # virtual-host style: <bucket>.minio -> bucket (AWS SDK default addressing)
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      internal:
        # One alias per bucket name from .env so <bucket>.minio resolves to MinIO (virtual-host style S3).
        aliases:
          - ${AWS_BUCKET:-tfh-local-assets}.minio
          - ${CATALOG_S3_BUCKET:-tfh-local-catalog}.minio
          - ${SEARCH_MODEL_S3_BUCKET:-tfh-local-search}.minio
          - ${SITEMAP_S3_BUCKET:-tfh-local-sitemap}.minio
          - ${YOTPO_S3_BUCKET:-tfh-local-yotpo}.minio

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: "no"
    entrypoint: ["/bin/sh", "/minio/init-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tfh-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tfh-local-minio-pw}
      BUCKETS: "${AWS_BUCKET:-} ${CATALOG_S3_BUCKET:-} ${SEARCH_MODEL_S3_BUCKET:-} ${SITEMAP_S3_BUCKET:-} ${YOTPO_S3_BUCKET:-}"
      SEARCH_MODEL_S3_BUCKET: ${SEARCH_MODEL_S3_BUCKET:-}
      SEARCH_MODEL_S3_KEY: ${SEARCH_MODEL_S3_KEY:-}
    volumes:
      - ./minio:/minio:ro
      # Seed source (repo files only): the vector-search repo's exported search model.
      - ./apps/vector-search-trulyfreehome/data:/seed/search:ro
    depends_on:
      minio: { condition: service_healthy }
    networks: [internal]

  klaviyo-recorder:
    build: ./klaviyo-recorder
    restart: unless-stopped
    environment:
      RECORDER_LOG: /data/calls.jsonl
    volumes: [klaviyo-data:/data]
    networks: [internal]

  # ---------------------------------------------------------------- stubs (TODO, profile `stub`)
  # ---------------------------------------------------------------- auth gateway (M2)
  # Mirrors apps/tf-apigateway/docker-compose.yml (Postgres 15, Kratos v1.3.1, Keto v0.12.0-alpha.0, api).
  # Differences: own volume/creds from .env, Kratos config = auth/kratos/kratos.yml (localhost URLs, no Google,
  # courier -> Mailpit), host ports only via ingress (127.0.0.1).
  gateway-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GATEWAY_DB_USER:-tfh_gateway_local}
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:-tfh_gateway_local_pw}
      POSTGRES_DB: ${GATEWAY_DB_NAME:-tfh_gateway_local}
    volumes: [gateway-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    restart: "no"
    environment: &kratos-env
      DSN: postgres://gateway-postgres:5432/${GATEWAY_DB_NAME:-tfh_gateway_local}?sslmode=disable&max_conns=20&max_idle_conns=4&user=${GATEWAY_DB_USER:-tfh_gateway_local}&password=${GATEWAY_DB_PASSWORD:-tfh_gateway_local_pw}
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE:-}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER:-}
      COURIER_SMTP_CONNECTION_URI: smtp://mailpit:1025/?disable_starttls=true
    volumes: &kratos-volumes
      - ./auth/kratos/kratos.yml:/etc/config/kratos/kratos.yml:ro
      - ./apps/tf-apigateway/config/kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
    command: ["-c", "/etc/config/kratos/kratos.yml", "migrate", "sql", "-e", "--yes"]
    depends_on:
      gateway-postgres: { condition: service_healthy }
    networks: [internal]

  kratos:
    image: oryd/kratos:v1.3.1
    restart: unless-stopped
    environment: *kratos-env
    volumes: *kratos-volumes
    command: ["serve", "-c", "/etc/config/kratos/kratos.yml", "--dev", "--watch-courier"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4434/admin/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      kratos-migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    networks: [internal]

  keto-migrate:
    image: oryd/keto:v0.12.0-alpha.0
    restart: "no"
    environment: &keto-env
      DSN: postgres://gateway-postgres:5432/${GATEWAY_DB_NAME:-tfh_gateway_local}?sslmode=disable&max_conns=20&max_idle_conns=4&user=${GATEWAY_DB_USER:-tfh_gateway_local}&password=${GATEWAY_DB_PASSWORD:-tfh_gateway_local_pw}
      LOG_LEVEL: info
    volumes: &keto-volumes
      - ./apps/tf-apigateway/config/keto/keto.yml:/etc/config/keto/keto.yml:ro   # DSN overridden by env
    command: ["migrate", "up", "-c", "/etc/config/keto/keto.yml", "-y"]
    depends_on:
      gateway-postgres: { condition: service_healthy }
    networks: [internal]

  keto:
    image: oryd/keto:v0.12.0-alpha.0
    restart: unless-stopped
    environment: *keto-env
    volumes: *keto-volumes
    command: ["serve", "-c", "/etc/config/keto/keto.yml"]
    depends_on:
      keto-migrate: { condition: service_completed_successfully }
    networks: [internal]

  tf-apigateway:
    build:
      context: ./apps/tf-apigateway
      dockerfile: Dockerfile.api
    image: tfh-local/tf-apigateway:local
    restart: unless-stopped
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      GIN_MODE: release
      LOG_LEVEL: info
      KRATOS_PUBLIC_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
      KETO_READ_URL: http://keto:4466
      KETO_WRITE_URL: http://keto:4467
      # DB_* intentionally unset: the gateway binary never opens its DB config (only Kratos/Keto use the DB, via DSN),
      # and preflight only allows DB_HOST=postgres.
      API_DOMAIN: http://localhost:${APIGATEWAY_HOST_PORT:-13004}
      KRATOS_DOMAIN: localhost
      OTEL_EXPORTER_OTLP_ENDPOINT: 127.0.0.1:4318
      CLOUDWATCH_ENABLED: "false"
    depends_on:
      kratos: { condition: service_healthy }
      keto: { condition: service_started }
    networks: [internal]

  # ---------------------------------------------------------------- memberportal (M2)
  # `next dev` image (docker/memberportal.Dockerfile). Points ONLY at local tf-api. tfhcore URLs are never set.
  # Builder.io is unreachable offline: a local /login overlay renders the real LoginForm; Builder pages 404.
  memberportal:
    build:
      context: ./apps/memberportal
      dockerfile: ../../docker/memberportal.Dockerfile
      additional_contexts:
        overlay: ./docker/memberportal-overlay
    image: tfh-local/memberportal:local
    restart: unless-stopped
    volumes:
      - ./docker/node-egress-preload.cjs:/opt/tfh-local/node-egress-preload.cjs:ro
    # Memory (root cause, M5a): uncapped, next dev's `next-server` child grew to ~5 GB RSS under the 4-worker gate
    # and the Docker VM's *global* OOM killer took it (and could pick other containers). The child is not PID 1, so
    # Docker never reported OOMKilled; `next dev` exited 0 and restart: unless-stopped brought it back.
    # Now: a cgroup limit (an OOM stays inside this container) paired with a V8 heap cap well below it (headroom for
    # SWC/webpack native memory), so V8 collects harder before the kernel steps in. Needs Docker Desktop >= 12 GB.
    mem_limit: ${MEMBERPORTAL_MEM_LIMIT:-5g}
    environment:
      <<: *proxy-env
      # Heap cap + server-side fetch through the egress proxy (Builder.io read-only); see docker/node-egress-preload.cjs.
      NODE_OPTIONS: --max-old-space-size=${MEMBERPORTAL_HEAP_MB:-3072} --require /opt/tfh-local/node-egress-preload.cjs
      NODE_ENV: development
      ENVIRONMENT: local
      NEXT_PUBLIC_ENVIRONMENT: local
      TF_API_DOMAIN: http://tf-api:3000
      NEXT_PUBLIC_TF_API_DOMAIN: http://localhost:${TF_API_HOST_PORT:-13000}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${TF_API_HOST_PORT:-13000}
      NEXT_PUBLIC_TF_CHECKOUT_DOMAIN: http://localhost:${TF_API_HOST_PORT:-13000}
      NEXT_PUBLIC_NEXT_GEN_DOMAIN: http://localhost:${MEMBERPORTAL_HOST_PORT:-13001}
      NEXT_PUBLIC_MEMBER_PORTAL_BASE_URL: http://localhost:${MEMBERPORTAL_HOST_PORT:-13001}
      MEMBER_PORTAL_BASE_URL: http://localhost:${MEMBERPORTAL_HOST_PORT:-13001}
      NEXT_PUBLIC_MEMBER_PORTAL_LOGIN_URL: http://localhost:${MEMBERPORTAL_HOST_PORT:-13001}/login
      NEXT_PUBLIC_COOKIE_DOMAIN: ""            # host-only cookies on localhost (default is .trulyfreehome.com)
      # Builder.io PUBLIC keys (read-only content API via proxy/readonly-allowlist.txt), set in .env (gitignored).
      # Unset -> placeholder: Builder SDK throws without a key; with it, fetches fail -> 404 component.
      NEXT_PUBLIC_BUILDER_API_KEY: ${LOCAL_BUILDER_PUBLIC_KEY_PORTAL:-tfh-local-offline}
      NEXT_PUBLIC_FUNNEL_BUILDER_API_KEY: ${LOCAL_BUILDER_PUBLIC_KEY_FUNNEL:-tfh-local-offline}
      KLAVIYO_BASE_URL: http://klaviyo-recorder:8090
      NEXT_PUBLIC_KLAVIYO_BASE_URL: http://localhost:${KLAVIYO_RECORDER_HOST_PORT:-18090}
      NEXT_PUBLIC_SENTRY_ENABLED: "false"
      NEXT_PUBLIC_GA4_ENABLED: "false"
      NEXT_PUBLIC_SURVEYS_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      # NEVER set: NEXT_PUBLIC_TRULY_FREE_CORE_API_URL, NEXT_PUBLIC_TFH_SESSION_API_URL, TFH_SESSION_API_URL_INTERNAL,
      # TFH_PYTHON_API_URL, TRULY_FREE_CORE_API_KEY (tfhcore OUT); NEXT_PUBLIC_TFH_LARAVEL_API_DOMAIN (legacy OUT).
    depends_on:
      tf-api: { condition: service_started }
    networks: [internal]

  # ---------------------------------------------------------------- admin panel + funnels (M3)
  # Both `next dev` (docker/next-dev.Dockerfile; repo env files dropped). Point ONLY at local tf-api/gateway/Kratos.
  # Staff login: admin /login links to the funnels app's /internal_admin/login (Kratos flow), which sets the
  # session cookie on localhost (cookies are not port-scoped, so the admin panel on :13002 sees it).
  admin-panel:
    build:
      context: ./apps/nextjs-campaign-admin-panel
      dockerfile: ../../docker/next-dev.Dockerfile
    image: tfh-local/admin-panel:local
    restart: unless-stopped
    mem_limit: 2g   # 1.5 GB is OOM-killed while compiling /dashboard
    environment:
      <<: *proxy-env
      NODE_OPTIONS: --max-old-space-size=1536
      NODE_ENV: development
      NEXT_PUBLIC_ENVIRONMENT: local
      NEXT_PUBLIC_FEATURE_FLAG_ENVIRONMENT: ${APP_ENV:-local}
      TF_API_DOMAIN: http://tf-api:3000
      TF_ADMIN_API_URL: http://tf-api:3000
      TF_ADMIN_API_ORIGIN: http://localhost:${ADMIN_PANEL_HOST_PORT:-13002}
      TF_INTERNAL_APIGATEWAY_DOMAIN: http://tf-apigateway:8080
      KRATOS_PUBLIC_URL: http://kratos:4433
      NEXT_PUBLIC_REDIRECT_URL: http://localhost:${ADMIN_PANEL_HOST_PORT:-13002}
      NEXT_PUBLIC_CUSTOMER_FRONT_URL: http://localhost:${FUNNELS_HOST_PORT:-13003}
      NEXT_PUBLIC_MEMBER_PORTAL_URL: http://localhost:${MEMBERPORTAL_HOST_PORT:-13001}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      NEXT_PUBLIC_OTEL_EXPORTER_OTLP_ENDPOINT: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      # NEVER set: CLOUDFLARE_* (cache purge), NEXT_PUBLIC_TRULY_FREE_CORE_API_URL (tfhcore OUT).
    depends_on:
      tf-api: { condition: service_started }
      tf-apigateway: { condition: service_started }
    networks: [internal]

  aff-landing-pages:
    build:
      context: ./apps/nextjs-aff-landing-pages
      dockerfile: ../../docker/next-dev.Dockerfile
    image: tfh-local/aff-landing-pages:local
    restart: unless-stopped
    # Memory (root cause, M5a): at 1500m with a 1024 MB heap, next dev's `next-server` child hit ~1.35 GB RSS
    # (heap + SWC/webpack native memory) and was cgroup-OOM-killed 5x under the gate (exit 0, not flagged OOMKilled).
    # Limit ~1.5x the heap cap leaves room for native memory.
    mem_limit: ${FUNNELS_MEM_LIMIT:-3g}
    volumes:
      - ./docker/node-egress-preload.cjs:/opt/tfh-local/node-egress-preload.cjs:ro
    environment:
      <<: *proxy-env
      NODE_OPTIONS: --max-old-space-size=${FUNNELS_HEAP_MB:-2048} --require /opt/tfh-local/node-egress-preload.cjs
      NODE_ENV: development
      NEXT_PUBLIC_ENVIRONMENT: local
      TF_API_DOMAIN: http://tf-api:3000
      TF_INTERNAL_APIGATEWAY_DOMAIN: http://tf-apigateway:8080
      KRATOS_PUBLIC_URL: http://kratos:4433
      NEXT_PUBLIC_BASE_URL: http://localhost:${FUNNELS_HOST_PORT:-13003}
      NEXT_PUBLIC_HOST_NAME: localhost
      NEXT_PUBLIC_MEMBER_PORTAL_LOGIN_URL: http://localhost:${MEMBERPORTAL_HOST_PORT:-13001}/login
      CORS_ALLOWED_ORIGINS: http://localhost:${FUNNELS_HOST_PORT:-13003},http://localhost:${ADMIN_PANEL_HOST_PORT:-13002}
      # Builder.io PUBLIC key (read-only content API via proxy/readonly-allowlist.txt), set in .env (gitignored).
      # Unset -> placeholder: Builder-backed pages (/, /offers/*, /info/*, /pages/*) 404 locally.
      NEXT_PUBLIC_BUILDER_API_KEY: ${LOCAL_BUILDER_PUBLIC_KEY_FUNNEL:-tfh-local-offline}
      NEXT_PUBLIC_SENTRY_ENABLED: "false"
      SENTRY_ENABLED: "false"
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_DISABLE_REFERRALS_TRACKING_SCRIPT: "true"
      # Search model: bundled unless flag search_model_s3_enabled is on; then S3 = local MinIO (never AWS).
      SEARCH_MODEL_S3_BUCKET: ${SEARCH_MODEL_S3_BUCKET:-}
      SEARCH_MODEL_S3_KEY: ${SEARCH_MODEL_S3_KEY:-}
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-tfh-local-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-tfh-local-minio-pw}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      # NEVER set: SITEMAP_S3_URL (remote CDN), BRAINTREE_*/RECAPTCHA_*/APPLE_PAY_* (payments), KLAVIYO_API_KEY,
      # TFH_CORE_* (tfhcore OUT). Checkout needs Sticky/TF: expected to fail offline.
    depends_on:
      tf-api: { condition: service_started }
    networks: [internal]

  # Vector search POC (profile `vector`: `make up VECTOR=1`). Local backend only: data/ files from the repo
  # (bind-mounted). VERTEX_* / GOOGLE_CLOUD_PROJECT are never set, so the Vertex AI backend is never used.
  vector-search:
    build:
      context: ./docker
      dockerfile: vector-search.Dockerfile
    image: tfh-local/vector-search:local
    profiles: ["vector"]
    restart: unless-stopped
    working_dir: /app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8077"]
    volumes:
      - ./apps/vector-search-trulyfreehome:/app:ro
    networks: [internal]

  # ---------------------------------------------------------------- cron (refuses; see cron/README.md)
  cron:
    image: alpine:3.20
    profiles: ["cron"]
    restart: "no"
    networks: [internal]
    command: ["sh", "-c", "echo 'REFUSED: local/stage cron runs are pending discussion with Michael. See cron/README.md.' >&2; exit 1"]
