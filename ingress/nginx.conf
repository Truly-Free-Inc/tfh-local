# Host -> internal TCP passthrough. Ports are bound to 127.0.0.1 on the host (see docker-compose.yml).
# Upstreams resolve lazily (Docker DNS) so ingress starts even if a service is still down.
worker_processes 1;
events { worker_connections 1024; }
stream {
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $server_port $tfh_upstream {
    15432 postgres:5432;
    16379 redis:6379;
    13000 tf-api:3000;
    18025 mailpit:8025;
    11025 mailpit:1025;
    19000 minio:9000;
    19001 minio:9001;
    18090 klaviyo-recorder:8090;
  }
  server { listen 15432; proxy_pass $tfh_upstream; }
  server { listen 16379; proxy_pass $tfh_upstream; }
  server { listen 13000; proxy_pass $tfh_upstream; }
  server { listen 18025; proxy_pass $tfh_upstream; }
  server { listen 11025; proxy_pass $tfh_upstream; }
  server { listen 19000; proxy_pass $tfh_upstream; }
  server { listen 19001; proxy_pass $tfh_upstream; }
  server { listen 18090; proxy_pass $tfh_upstream; }
}
